name: Check Status

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: check-status
  # 不取消正在运行的 run：快手风控重试需要较长时间（约15-20分钟），
  # cancel-in-progress: true 会导致正在执行的 check_posts.py 被 SIGTERM 终止，
  # 增量保存的 posts_status.json 虽然已写入本地但来不及 commit，结果丢失。
  # false 让 run 排队依次执行，避免结果丢失。
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # key 含 headless-shell 标记：headless=True 需要 chromium-headless-shell，
          # 旧缓存只装了完整 chromium，会导致 launch 报 Executable doesn't exist。
          key: playwright-headless-shell-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # 同时安装 chromium 和 chromium-headless-shell：headless=True 用 headless-shell，
        # headless=False（monitor.py 直播检测）用完整 chromium。
        run: python -m playwright install --with-deps chromium chromium-headless-shell

      - name: Check live status
        id: check_live
        continue-on-error: true
        env:
          MONITOR_CONFIG: ${{ secrets.MONITOR_CONFIG }}
        run: python monitor.py

      - name: Commit live status
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add status.json state.json history.json rooms.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update status [skip ci]"
          git pull --rebase origin main 2>/dev/null || true
          git push || echo "push skipped (no changes or conflict)"

      - name: Check new posts
        id: check_posts
        continue-on-error: true
        timeout-minutes: 15
        env:
          MONITOR_CONFIG: ${{ secrets.MONITOR_CONFIG }}
        run: |
          python check_posts.py
          # 推送通知后立即 commit state.json（含 seen_posts），防止 run 被 concurrency
          # 取消时 state 丢失导致下一个 run 把同一条作品当新作品重复推送。
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git pull --rebase origin main 2>/dev/null || true
          git push || echo "push skipped (no changes or conflict)"

      - name: Commit posts
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add posts.json posts_status.json posts_rooms.json posts_debug.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posts [skip ci]"
          git pull --rebase origin main 2>/dev/null || true
          git push || echo "push skipped (no changes or conflict)"

      - name: Schedule next run
        if: always()
        run: |
          # 节奏控制：sleep 600s（10分钟），
          # cancel-in-progress: false 后 run 会排队执行，sleep 太短会堆积大量 queued run。
          # 主要节奏由 cron（每 30 分钟）保证；self-dispatch 仅作链路兜底。
          sleep 600
          curl -s --max-time 30 --connect-timeout 10 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/check.yml/dispatches \
            -d '{"ref":"main"}' \
            || echo "dispatch failed, will rely on schedule cron as fallback"
